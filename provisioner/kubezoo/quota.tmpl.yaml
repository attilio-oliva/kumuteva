# Vendored from kubewharf/kubezoo
#   upstream: config/setup/quota.tmpl.yaml
#   commit:   8a3a05f83cfe0576c24d896d898683001bd833e5
#
# Changes from upstream:
#   - clusterresourcequota image tag local-up -> ${KUBEZOO_IMAGE_TAG}
#   - the CA placeholder is untouched: gen_pki.sh still fills it
#   - the webhook's namespaceSelector is `{}` upstream (every namespace) and is
#     narrowed here to namespaces carrying `kubezoo.io/tenant`, the label KubeZoo
#     puts on every upstream namespace it creates for a tenant. The published
#     v0.2.0 webhook panics on any request whose user carries `extra` fields —
#     a service-account token does —
#
#       http: panic serving ...: assignment to entry in nil map
#       .../clusterresourcequota/controllers.CreateAdmissionAttributes webhook.go:107
#
#     and with failurePolicy: Fail every such pod is refused. The first victim
#     was the local-path provisioner's helper pod in `local-path-storage`: no
#     PersistentVolume could be provisioned, so every PVC stayed Pending and the
#     storage fairness assessment timed out on all runs. Quotas exist only in
#     tenant namespaces, so scoping the webhook to them changes nothing a tenant
#     is subject to.
#
# Pinned rather than fetched so a provisioning run is reproducible and
# needs no network access to GitHub. Upstream is effectively unmaintained:
# its only git tag is v0.1.0 while the published images are v0.2.0, which
# is why this records a commit rather than a tag.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubezoo-cluster-resource-quota
  labels:
    app: kubezoo-cluster-resource-quota
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubezoo-cluster-resource-quota
  template:
    metadata:
      labels:
        app: kubezoo-cluster-resource-quota
    spec:
      serviceAccountName: kubezoo-cluster-resource-quota
      containers:
        - name: resource-quota
          image: kubezoo/clusterresourcequota:${KUBEZOO_IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          command:
          - /usr/local/bin/clusterresourcequota
          - -webhook-port=6443
          - -webhook-cert-dir=/etc/quota-webhook/pki
          ports:
            - name: webhook
              containerPort: 6443
              protocol: TCP
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: healthz
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz/
              port: healthz
          readinessProbe:
            httpGet:
              path: /healthz/
              port: healthz
          volumeMounts:
          - name: quota-webhook-pki
            mountPath: /etc/quota-webhook/pki
          - name: log
            mountPath: /var/log/kubezoo-quota
      volumes:
      - name: quota-webhook-pki
        secret:
          secretName: quota-webhook-pki
      - name: log
        emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubezoo-cluster-resource-quota

---
# quota service
apiVersion: v1
kind: Service
metadata:
  name: kubezoo-cluster-resource-quota
spec:
  type: ClusterIP
  ports:
    - port: 6443
      targetPort: webhook
      protocol: TCP
      name: webhook
    - port: 8080
      targetPort: metrics
      protocol: TCP
      name: metrics
    - port: 8081
      targetPort: healthz
      protocol: TCP
      name: healthz
  selector:
    app: kubezoo-cluster-resource-quota

---
# quota controller cluster role
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubezoo-cluster-resource-quota
rules:
- apiGroups:
  - "*"
  resources:
  - "*"
  verbs:
  - "*"
---
# quota controller cluster role binding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubezoo-cluster-resource-quota
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubezoo-cluster-resource-quota
subjects:
- kind: ServiceAccount
  name: kubezoo-cluster-resource-quota
  namespace: default
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: clusterresourcequota.kubezoo.io
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    caBundle: {caBundle}
    service:
      name: kubezoo-cluster-resource-quota
      namespace: default
      path: /admission/validating/clusterresourcequotas
      port: 6443
  failurePolicy: Fail
  matchPolicy: Equivalent
  name: clusterresourcequota.kubezoo.io
  namespaceSelector:
    matchExpressions:
    - key: kubezoo.io/tenant
      operator: Exists
  objectSelector: 
    matchExpressions:
    - key: app
      operator: NotIn
      values: 
      - kubezoo-cluster-resource-quota
  rules:
  - apiGroups:
    - ""
    apiVersions:
    - v1
    operations:
    - CREATE
    resources:
    - pods
    scope: Namespaced
  sideEffects: None
  timeoutSeconds: 5
