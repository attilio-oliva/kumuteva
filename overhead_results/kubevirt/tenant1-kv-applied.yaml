---
apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: "tenant1-kv"
  namespace: "tenant1"
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
        - 10.243.0.0/16
    services:
      cidrBlocks:
        - 10.95.0.0/16
  infrastructureRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
    kind: KubevirtCluster
    name: 'tenant1-kv'
    namespace: "tenant1"
  controlPlaneRef:
    apiVersion: controlplane.cluster.x-k8s.io/v1beta1
    kind: KubeadmControlPlane
    name: 'tenant1-kv-control-plane'
    namespace: "tenant1"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: KubevirtCluster
metadata:
  name: "tenant1-kv"
  namespace: "tenant1"
spec:
  controlPlaneServiceTemplate:
    spec:
      type: ClusterIP
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: KubevirtMachineTemplate
metadata:
  name: "tenant1-kv-control-plane"
  namespace: "tenant1"
spec:
  template:
    spec:
      virtualMachineBootstrapCheck:
        checkStrategy: ssh
      virtualMachineTemplate:
        metadata:
          namespace: "tenant1"
        spec:
          runStrategy: Always
          template:
            spec:
              domain:
                cpu:
                  cores: 2
                memory:
                  guest: "4Gi"
                devices:
                  networkInterfaceMultiqueue: true
                  disks:
                    - disk:
                        bus: virtio
                      name: containervolume
              evictionStrategy: External
              volumes:
                - containerDisk:
                    image: "quay.io/capk/ubuntu-2404-container-disk:v1.32.1"
                  name: containervolume
---
kind: KubeadmControlPlane
apiVersion: controlplane.cluster.x-k8s.io/v1beta1
metadata:
  name: "tenant1-kv-control-plane"
  namespace: "tenant1"
spec:
  replicas: 1
  machineTemplate:
    infrastructureRef:
      kind: KubevirtMachineTemplate
      apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
      name: "tenant1-kv-control-plane"
      namespace: "tenant1"
  kubeadmConfigSpec:
    clusterConfiguration:
      networking:
        dnsDomain: "tenant1-kv.tenant1.local"
        podSubnet: 10.243.0.0/16
        serviceSubnet: 10.95.0.0/16
    initConfiguration:
      nodeRegistration:
        criSocket: "/run/containerd/containerd.sock"
    joinConfiguration:
      nodeRegistration:
        criSocket: "/run/containerd/containerd.sock"
  version: "v1.32.1"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: KubevirtMachineTemplate
metadata:
  name: "tenant1-kv-md-0"
  namespace: "tenant1"
spec:
  template:
    spec:
      virtualMachineBootstrapCheck:
        checkStrategy: ssh
      virtualMachineTemplate:
        metadata:
          namespace: "tenant1"
        spec:
          runStrategy: Always
          template:
            spec:
              domain:
                cpu:
                  cores: 2
                memory:
                  guest: "4Gi"
                devices:
                  networkInterfaceMultiqueue: true
                  disks:
                    - disk:
                        bus: virtio
                      name: containervolume
              evictionStrategy: External
              volumes:
                - containerDisk:
                    image: "quay.io/capk/ubuntu-2404-container-disk:v1.32.1"
                  name: containervolume
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
kind: KubeadmConfigTemplate
metadata:
  name: "tenant1-kv-md-0"
  namespace: "tenant1"
spec:
  template:
    spec:
      joinConfiguration:
        nodeRegistration:
          kubeletExtraArgs: {}
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  name: "tenant1-kv-md-0"
  namespace: "tenant1"
spec:
  clusterName: "tenant1-kv"
  replicas: 1
  selector:
    matchLabels:
  template:
    spec:
      clusterName: "tenant1-kv"
      version: "v1.32.1"
      bootstrap:
        configRef:
          name: "tenant1-kv-md-0"
          namespace: "tenant1"
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
          kind: KubeadmConfigTemplate
      infrastructureRef:
        name: "tenant1-kv-md-0"
        namespace: "tenant1"
        apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
        kind: KubevirtMachineTemplate